structured-info:
  zh-CN:
    summary: 把链接、文档或视频里的真实信息变成以原始画面为主、讲得清楚的资讯短片。
    best-for:
      - 科技资讯
      - 数据新闻
      - 产品解读
    how-to-use: 提供链接、文档或视频并说明主题、语言和时长，选择是否标注来源及画面尺寸后开始制作。
    outputs: 资讯解说成片、可编辑工程或制作包、脚本分镜及来源记录。
  en-US:
    summary: Turns the real information in links, documents or videos into a clear news short led by original media.
    best-for:
      - Tech news
      - Data journalism
      - Product explainers
    how-to-use: Provide links, documents or videos with topic, language and duration, then choose source attribution and frame size to start.
    outputs: News explainer video, editable project or production package, script, storyboard and source records.
