# GPT-6 适配变更说明：同步入口说明与当前授权复用规则，保留原有元数据结构。
display-name-zh: MG 口播动画生成器
version: 0.1.6
summary-en: "Create reviewable MG plans and hand each approved Panel through h3-prompt-writing into Canvas."
summary-cn: "基于口播、产品素材或主题需求制定 MG 方案，并把已确认 Panel 经 h3-prompt-writing 交给 Canvas。"
desc-en: "Plan H3 MG animation for explainers, launches, demos, walkthroughs, concepts, and abstract themes. The user may provide product images, screenshots, voiceover text, audio, product documents, a real product, a fictional product name, or only a theme. The skill resolves missing facts only when they change the result, then uses MG animation references to define delivery specs, product setup, visual style, narrative structure, timed shots, screen text, voiceover, element motion, transition bridges, brand or product rules, music, and subtle sound effects. Each approved Panel is handed to h3-prompt-writing for the final H3 text, then saved to a Canvas video node, frozen as one confirmed snapshot, and routed through the selected available Canvas provider."
desc-cn: "面向需要制作 MG 动画讲解、产品发布、功能演示、App/SaaS 界面说明、概念产品和抽象主题表达的用户。用户可提供口播文案、配音音频、产品图、界面截图、产品资料或主题设定。Skill 会只在关键事实缺失时补问，再结合 MG 动画知识库确定视觉风格、叙事结构、分镜节奏、屏幕文字、Voiceover、动效、转场、品牌规则和音频设计。已确认的单 Panel 创作事实交给 h3-prompt-writing 定稿，再保存到 Canvas 视频节点；只有确认后的固定快照才交给所选可用能力。适合信息讲解和产品演示，不适合真人写实视频或复杂剧情短片制作。"
