interface:
  display_name: "从零故事分镜"
  short_description: "完成故事板、可变网格黑白分镜板与简化的 LFO 执行交接"
  default_prompt: "使用 $zero-to-story 把我的故事整理成经确认的 Camera Setup、六 Beat 语义映射、角色资产和逐 Panel 视觉资产路由；对需要 R2V 的 Panel，STEP 1 先确定一个 rowsxcolumns 网格布局（2–6 格，如 1x2、2x2、2x3），STEP 3 只生成一张 storyboard_board.<panel> 自包含黑白分镜板，按从左到右、从上到下映射选定的 Beat、Setup 和唯一信息，不生成独立分镜帧、不后期拼接；H3 默认只接收这一张板，必要时才加入非分镜引用。非 R2V Panel 只生成必要的场景关键帧/目标尾帧；视频提示词交给 $h3-prompt-writing，再为每个 Panel 使用一份批准执行包，按 Panel 串行交接给 LFO。"
