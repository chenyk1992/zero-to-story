summary-en: "Create approved 2x3 storyboards and H3 video packages (compact or cinematic tier)"
summary-cn: "从灵感构建经确认的 2×3 六镜分镜与 H3 视频包（紧凑档/成片档双档提示词）"
desc-en: "Guides creators from an idea, novel, screenplay, or short-drama handoff through an approved storyboard brief, character sheets, directly generated 2x3 six-shot boards, structured MiniMax H3 prompts (compact tier ≤ 900 chars or cinematic tier 1.5–3KB), and an LFO execution package. Aligned with the official MiniMax H3 manual: 3-section formula, photography vocabulary table, J/L-cut dialogue rules, three generation-mode templates, and TTS language coverage. A single editable brief records stage status and prevents unapproved work from progressing."
desc-cn: "适用于从灵感、小说、剧本或短剧 handoff 构建视频的创作者。流程依次完成故事板概要、角色设定图、一次直出的 2×3 六镜黑白分镜板、MiniMax H3 双档提示词（紧凑档 ≤ 900 字符 / 成片档 1.5–3KB）和 LFO 执行包，并在唯一可编辑主文档中记录阶段状态，阻止未确认内容进入后续步骤。v0.9.0 对齐官方 H3 手册：3 段公式、运镜词汇表、跨 shot 台词规则、3 种生成模式模板与 TTS 多语种支持。"
