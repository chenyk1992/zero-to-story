desc-en: "Guides creators from an idea, novel, screenplay, or short-drama handoff through an approved storyboard brief, character sheets, directly generated 2x3 six-shot boards, three-tier MiniMax H3 Panel prompts, and an LFO execution package. The prompt method keeps a temporary control plan, dynamic timing, continuity deltas, and fixed reference mapping while leaving volatile backend capabilities in a dated reference. A single editable brief records stage status and prevents unapproved work from progressing."
desc-cn: "适用于从灵感、小说、剧本或短剧 handoff 构建视频的创作者。流程依次完成故事板概要、角色设定图、一次直出的 2×3 六镜黑白分镜板、MiniMax H3 三档 Panel 提示词和 LFO 执行包；提示词阶段使用仅在推理中存在的控制计划、动态时序、最小连续性差异和固定图片映射，易变 backend 能力单独记录来源与核验日期，唯一可编辑主文档记录阶段状态，阻止未确认内容进入后续步骤。"
