desc-en: "Guides creators from an idea, novel, screenplay, or short-drama handoff through an approved storyboard brief, character sheets, Camera Setup planning, six-beat semantic maps, selective per-Panel visual control assets, and an LFO execution handoff. It chooses the video operation before deciding whether STEP 3 needs no image, a 2x3 board, a scene keyframe, or a target last frame. It does not write or optimize H3 video prompts: each approved Panel is handed to the dedicated h3-prompt-writing skill, and only that skill's user-approved output may be passed through to an execution package."
desc-cn: "适用于从灵感、小说、剧本或短剧 handoff 构建视频的创作者。流程依次完成故事板概要、角色设定图、Camera Setup、六 Beat 语义映射和逐 Panel 选择性视觉控制资产。先选视频 operation，再决定 STEP 3 无需生成图、生成 2×3 分镜板、场景关键帧或目标尾帧。本 Skill 不撰写或优化 H3 视频提示词，每个已确认 Panel 必须交给 h3-prompt-writing，执行包只能逐字透传该 Skill 经用户确认的输出。"
