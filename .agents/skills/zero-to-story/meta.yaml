desc-en: "Guides creators from an idea, novel, screenplay, or short-drama handoff through an approved storyboard brief, character sheets, Camera Setup planning, six-beat semantic maps, a single self-contained variable-grid storyboard board per R2V Panel, and per-Panel LFO execution packages. For R2V, STEP 1 locks a rowsxcolumns layout with 2–6 cells, and STEP 3 makes one image-generation call that outputs the exact board; it does not generate independent reference frames or stitch them later. Cells map selected Beat, Setup, and unique visual information in reading order, while H3 receives the board as one reference image by default. It does not write or optimize H3 video prompts: each approved Panel is handed to h3-prompt-writing, then its exact-file-SHA256-approved package is executed serially as an isolated unit through comfy-cli."
desc-cn: "适用于从灵感、小说、剧本或短剧 handoff 构建视频的创作者。流程依次完成故事板概要、角色设定图、Camera Setup、六 Beat 语义映射、逐 Panel 单张自包含可变网格黑白分镜板和逐 Panel LFO 执行包。对 R2V，STEP 1 先锁定 rowsxcolumns 网格（2–6 格），STEP 3 只调用一次图片生成，直接输出准确网格与顺序的整张分镜板；不生成独立参考帧，也不后期拼接。板内格位按从左到右、从上到下映射选定的 Beat、Setup 和每格唯一信息，H3 默认只接收这一张板，必要时才追加非分镜引用。本 Skill 不撰写或优化 H3 视频提示词，每个已确认 Panel 必须交给 h3-prompt-writing；执行时每个 Panel 使用各自执行包的精确文件字节 SHA-256 作为唯一锁，并通过独立执行单元串行调用 comfy-cli。"
