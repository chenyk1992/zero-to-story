desc-en: "Turns ideas, novels, screenplays, or short-drama handoffs into adaptation decisions, storyboard briefs, Camera Setups, six-beat semantic maps, necessary identity/visual assets, and per-Panel Canvas handoff. Control needs determine the mode and assets: R2V may use ordinary references or one self-contained storyboard board. Only the board strategy locks a rowsxcolumns layout of 2–6 cells and creates or reuses one complete image, without separate cell generation or later stitching. Each approved Panel goes to h3-prompt-writing for the full prompt, then to Canvas for one execution from a confirmed snapshot through the selected available provider. Song-driven MVs use music-video-creator."
desc-cn: "将灵感、小说、剧本或短剧交接转成改编决策、故事板概要、Camera Setup、六 Beat 语义映射、必要身份/视觉资产与逐 Panel Canvas 交接。先按控制需求选择模式和资产：R2V 可用普通参考或单张自包含分镜板；仅分镜板策略锁定 rowsxcolumns 的 2–6 格布局，一次生成或复用整板，不逐格生成或后期拼板。每个已确认 Panel 交给 h3-prompt-writing 定稿完整提示词，再由 Canvas 确认固定快照并通过所选可用能力单次执行。歌曲驱动 MV 使用 music-video-creator。"
