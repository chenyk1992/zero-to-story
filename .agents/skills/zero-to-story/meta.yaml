desc-en: "Guides creators from an idea, novel, screenplay, or short-drama handoff through an approved storyboard brief, character sheets, Camera Setup planning, six-beat semantic maps, a single self-contained variable-grid storyboard board matching the target film look per R2V Panel, and per-Panel Canvas handoff. For R2V, STEP 1 locks a rowsxcolumns layout with 2–6 cells, and STEP 3 makes one image-generation call that outputs the exact board; it does not generate independent reference frames or stitch them later. Cells map selected Beat, Setup, and unique visual information in reading order, while H3 receives the board as one reference image by default. It does not write or optimize H3 video prompts: each approved Panel is handed to h3-prompt-writing, then saved to a Canvas video node and executed once from a confirmed immutable snapshot through the selected available provider."
desc-cn: "适用于从灵感、小说、剧本或短剧 handoff 构建视频的创作者。流程依次完成故事板概要、角色设定图、Camera Setup、六 Beat 语义映射、逐 Panel 单张自包含可变网格电影画面分镜板和逐 Panel Canvas 交接。对 R2V，STEP 1 先锁定 rowsxcolumns 网格（2–6 格），STEP 3 只调用一次图片生成，直接输出准确网格与顺序的整张分镜板；不生成独立参考帧，也不后期拼接。板内格位按从左到右、从上到下映射选定的 Beat、Setup 和每格唯一信息，H3 默认只接收这一张板，必要时才追加非分镜引用。本 Skill 不撰写或优化 H3 视频提示词，每个已确认 Panel 必须交给 h3-prompt-writing，再保存到 Canvas 视频节点，由确认后的固定快照通过所选可用能力单次执行。"
