name: star-history
on:
  schedule:
    - cron: '41 1 * * *'  # 每天 09:41 北京时间
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}  # 脚本走 GraphQL 读 stargazers，自带 token 放行（REST 端点会 403）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: star-data
          path: star-data
      - run: python3 automation/gen_star_history.py star-data/star-growth.svg
      - name: 有变化才提交到 star-data 分支
        run: |
          cd star-data
          if git diff --quiet star-growth.svg; then
            echo "星数无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-growth.svg
          git commit -m "自动刷新 star 曲线"
          git push
