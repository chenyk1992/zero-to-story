summary-en: "Turns transcript-led narration into B-roll plans and single-Panel video handoffs for knowledge and talking-head edits."
summary-cn: "把口播逐字稿按语义拆成可审片的 B-roll 镜头方案，并在任务已授权且 hash 获批后生成视频素材。"
desc-en: "This Skill helps creators turn a transcript, voiceover draft, data-rich narration, or talking-head script into a reviewable B-roll plan and single-Panel video handoff. The user provides the script plus optional logos, screenshots, documents, charts, product photos, data tables, or references. The workflow segments the transcript by meaning, routes each unit to A-roll retention, evidence handling, existing-material reuse, motion typography, pure visual B-roll, or a continuous one-take beat, then flags missing materials. It proceeds when the current instruction or an existing plan authorizes the scope, pauses only for missing facts or exact package-hash approval, and keeps generation serial while provider/model selection stays with the runtime. It is best for knowledge videos, explainers, market analysis, and transcript-led edits, not pure subtitle export, simple trimming, one-off image prompts, or unrelated long-form editing."
desc-cn: "本 Skill 面向已有逐字稿、配音稿、数据型讲稿或口播脚本的创作者，将内容转化为可审片的 B-roll 方案和逐 Panel 视频交接。用户需提供完整脚本，也可补充 Logo、截图、文档、图表、产品图、数据表或参考素材；流程会先按语义拆分，再判断各段应保留为 A-roll、证据处理、复用素材、动态文字、纯视觉副镜头，或连续一镜到底中的视觉节拍，随后标出缺失素材。当前指令或已有计划已授权且信息足够时直接推进，只有缺关键事实或精确 hash 尚未获批时暂停；每个 Panel 独立写包、串行交给 LFO。本 Skill 不默认或强制模型。适合知识视频、讲解视频、市场分析和逐字稿驱动剪辑，不处理纯字幕导出、简单剪切、单次图片提示词或无关长篇剪辑。"
