desc-en: "Deep AI-video deconstruction with replica prompts. Reads video metadata, builds a traceable evidence chain from dense keyframes, and outputs a structured Markdown report. When the user requests a prompt, produces one MiniMax-H3 or Seedance 2.0 branch using the selected route or one supported route chosen when unspecified; source-model inference and target routing remain separate. Uses whatever media and canvas tools are available and does not generate video itself."
