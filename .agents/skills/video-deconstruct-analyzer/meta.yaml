summary-en: "Deconstruct AI videos with dense keyframes and route copyable prompts to MiniMax-H3 by default or Seedance 2.0 when requested."
summary-cn: "高密度拆解 AI 视频，默认 MiniMax-H3，支持 Seedance 2.0 复刻提示词"
desc-en: "Deep AI-video deconstruction with replica prompts. Reads video metadata, builds a canvas evidence chain from dense keyframes, and outputs a structured Markdown report. Routes the target prompt to MiniMax-H3 by default or Seedance 2.0 when explicitly requested; source-model inference and target-model routing remain separate. Aimed at reference analysis, not general editing or subtitle work."
desc-cn: "AI 视频深度拆解与复刻提示词。读取视频元信息并用高密度关键帧建立画布证据链，输出结构化 Markdown 报告；目标提示词未指定时默认 MiniMax-H3，明确指定时使用 Seedance 2.0，原视频来源模型推测与目标模型路由分开；面向参考分析，不做普通剪辑/字幕。"
