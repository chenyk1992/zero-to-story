summary-en: "Deconstruct AI videos with dense keyframes and Seedance prompts."
summary-cn: "高密度拆解AI视频"
desc-en: "Deep AI-video deconstruction with replica prompts. Reads video metadata and builds a canvas evidence chain from dense keyframes, outputs a structured Markdown deconstruction report, and reverse-engineers Seedance 2.0 Chinese timestamp storyboard prompts under the rule of preferably fifteen seconds or less per clip and as few prompts as possible. Aimed at reference analysis, not general editing or subtitle work."
desc-cn: "AI 视频深度拆解与复刻提示词。读取视频元信息 + 高密度关键帧建立画布证据链，输出结构化 Markdown 拆解报告，并按“每条尽量≤15 秒、提示词数量尽量少”反推 Seedance 2.0 中文时间戳分镜复刻提示词；面向参考分析，不做普通剪辑/字幕。"
