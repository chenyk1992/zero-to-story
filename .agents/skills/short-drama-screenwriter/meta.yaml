desc-en: "Writes domestic or overseas short dramas and standalone sitcom sketches, with characters, exact dialogue, causal beats and optional creative handoff. Shares optional reversal methods that preserve director truth and audience/character knowledge without changing genre or ending outcome. Serial hooks and paywall structures apply only when relevant; standalone comedy uses setup, escalation and payoff. Does not generate media."
desc-cn: "创作国内/海外微短剧及独立情景喜剧，交付角色、准确对白、可拍节拍与按需创作交接。共享可选反转方法，保留导演真相与观众/人物获知安排，不混淆类型和结局走向。连载钩子和付费结构只在适用时采用，独立喜剧以铺垫、升级和回收组织，不执行媒体生成。"
