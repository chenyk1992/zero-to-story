name: CI

on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install media test tools
        # Media assembly, audio and subtitle tests must run in CI, not skip
        # merely because the runner does not have the media executables.
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop

      - name: Run full test suite including real media
        run: python -m pytest tests/ -v --tb=short
