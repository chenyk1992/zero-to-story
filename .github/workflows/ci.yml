name: CI

on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Keep local workflow outputs out of Git
        shell: pwsh
        run: |
          $trackedOutputs = @(git ls-files -- workspace .short-drama db)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($trackedOutputs.Count -gt 0) {
            throw "Local workflow outputs must not be tracked ($($trackedOutputs.Count) files)."
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,canvas]"

      - name: Check Python and project configuration
        run: |
          python -m ruff check src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pyright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_ai_config.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/canvas/package-lock.json

      - name: Check Canvas frontend
        working-directory: web/canvas
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Install media test tools
        # Media assembly, audio and subtitle tests must run in CI, not skip
        # merely because the runner does not have the media executables.
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Command ffmpeg, ffprobe -ErrorAction Stop

      - name: Run full test suite including real media
        run: python -m pytest tests/ -v --tb=short
