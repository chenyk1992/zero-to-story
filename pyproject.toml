[project]
name = "lfo"
version = "1.0.0"
description = "LFO — reusable local video generation, media processing, and export runtime."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "websocket-client>=1.8",
    "pynvml>=11.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "RUF002", # docstring ambiguous characters (Chinese punctuation)
    "RUF005", # f-string ambiguous characters
    "SIM102", # use single if (style preference)
    "SIM108", # use ternary (style preference)
    "SIM116", # use dict instead of if-chain (style preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM", "RUF059", "F841", "B007", "B017", "RUF001", "E402", "F811", "B905", "RUF043"]
"**/__init__.py" = ["F401", "RUF022"]
"src/lfo/environment/tools/resource_probe.py" = ["SIM112"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/lfo"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportMissingParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
